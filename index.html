<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en"> <!-- Update `class="theme-auto"` with your preference -->

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>Useful Family Links</title>
    <link rel="icon" type="image/png" href="images/avatar.png"> <!-- Update this with your own favicon -->

    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="Useful family links.">

    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <link rel="canonical" href="https://www.mattmole.co.uk">

    <!-- Author Information -->
    <meta name="author" content="Matt Holder">

    <!-- Browser UI Color - Matches the default light/dark theme backgrounds -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

    <!-- Social Sharing (Open Graph & Twitter) - Uncomment and fill in to control how your page
         looks when shared on social platforms and in chat apps.
         og:url and og:image must be full absolute URLs. -->
    <!--
    <meta property="og:type" content="website">
    <meta property="og:title" content="Your Name">
    <meta property="og:description" content="A short description of your page.">
    <meta property="og:url" content="https://yourwebsite.com">
    <meta property="og:image" content="https://yourwebsite.com/images/avatar@2x.png">
    <meta name="twitter:card" content="summary">
    -->

    <!-- Font Preloads - Lets the browser fetch fonts in parallel with the stylesheets -->
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-800.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

    <!-- LittleLink Extended Stylesheet (Optional) -->
    <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
    <!-- Learn more at https://github.com/sethcottle/littlelink-extended.
         Remove comments if you've added LittleLink Extended dependencies -->

  </head>

<body>

    <div class="container">
        <div class="column">
          <main>

            <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
            <img class="avatar avatar--rounded" src="images/avatar.png" srcset="images/avatar@2x.png 2x" alt="LittleLink" width="128" height="128" fetchpriority="high">

            <!-- Replace with your name or brand -->
            <h1>Useful Family Links</h1>

            <!-- Add a short description about yourself or your brand -->
            <p>These are useful family links.</p>

            <!-- All your buttons go here -->
            <nav class="button-stack" aria-label="Links">

              <h2>Family Links</h2>

              <!-- Accelerated Reader -->
              <a class="button button-default" href="https://login.renaissance.com/12d2c610-13cb-42e7-ac20-3db921adae78/student?state=14300410-2e4f-46ea-bb54-5e83317a7e4e" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-website.svg" alt="Website Icon">Accelerated Reader</a>

              <!-- Term dates -->
              <a class="button button-default" href="https://www.staffordshire.gov.uk/schools-and-learning/school-term-dates" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-website.svg" alt="Website Icon">Term Dates</a>




              <br>
              <br>
              <h2>Home Lab</h2>

              <!-- Default LittleLink -->
              <a class="button button-default" href="#" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/littlelink.svg" alt="LittleLink Logo">LittleLink</a>

              <!-- Unsplash -->
              <a class="button button-unsplash" href="#" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/unsplash.svg" alt="Unsplash Logo">Unsplash</a>

              <!-- Generic Blog -->
              <a class="button button-default" href="#" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-blog.svg" alt="Blog Icon">Read our blog</a>

              <!-- Generic Cloud -->
              <a class="button button-default" href="#" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-cloud.svg" alt="Cloud Icon">Download File</a>

              <!-- Generic Code -->
              <a class="button button-default" href="#" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-code.svg" alt="Code Icon">View the code</a>

              <!-- Generic Computer -->
              <a class="button button-default" href="#" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-computer.svg" alt="Computer Icon">Homelab Setup</a>

              <!-- Generic Homepage -->
              <a class="button button-default" href="#" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-homepage.svg" alt="Homepage Icon">Visit Homepage</a>

              <!-- Generic Website -->
              <a class="button button-default" href="#" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-website.svg" alt="Website Icon">Visit Website</a>

              <!-- LittleLink Extended -->
              <a class="button button-default" href="https://github.com/sethcottle/littlelink-extended" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/littlelink.svg" alt="LittleLink Logo">LittleLink Extended</a>

      </nav>
      </main>

      <!-- Feel free to add your own footer information, including updating `privacy.html` to reflect how your LittleLink fork is set up -->
      <footer>
        <a href="privacy.html">Privacy Policy</a> | Build your own by forking <a href="https://littlelink.io" target="_blank" rel="noopener">LittleLink</a>
      </footer>

    </div>
  </div>

</body>

</html>
